<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal-Hunter · 羊毛雷达</title>
<style>
  :root{
    --bg:#0a0d16; --panel:#111726; --panel2:#151d30; --line:#1f2941;
    --txt:#e8ecf6; --dim:#8d9ab5; --dim2:#5f6c87;
    --aqua:#37e0c0; --violet:#8b7cff; --amber:#ffbe55; --rose:#ff6b81;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(139,124,255,.18), transparent 60%),
      radial-gradient(900px 500px at 88% 0%, rgba(55,224,192,.14), transparent 55%),
      var(--bg);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(140deg,var(--violet),var(--aqua));box-shadow:var(--shadow)
  }
  h1{font-size:21px;margin:0;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--dim)
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
  .dot.ok{background:var(--aqua);box-shadow:0 0 0 4px rgba(55,224,192,.15)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(255,190,85,.15)}
  .dot.bad{background:var(--rose);box-shadow:0 0 0 4px rgba(255,107,129,.15)}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)
  }
  .kpi{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .kpi small{font-size:13px;color:var(--dim2);font-weight:400;margin-left:4px}
  .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);margin-bottom:6px}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  .section{margin-top:26px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin:0 0 12px;font-weight:600}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input[type=search]{
    background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:9px 13px;min-width:230px;font-size:13.5px;outline:none
  }
  input[type=search]:focus{border-color:var(--violet)}
  .chip{
    cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--dim);font-size:12.5px;user-select:none
  }
  .chip[aria-pressed=true]{border-color:var(--aqua);color:var(--txt);background:rgba(55,224,192,.1)}
  .deal{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:15px 17px;align-items:start}
  .deal + .deal{border-top:1px solid var(--line)}
  .score{
    height:52px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:19px;
    font-variant-numeric:tabular-nums;background:rgba(255,255,255,.04);border:1px solid var(--line)
  }
  .score.hi{color:#06121a;background:linear-gradient(150deg,var(--aqua),#7ce8d3);border-color:transparent}
  .score.mid{color:var(--aqua);border-color:rgba(55,224,192,.35)}
  .score.low{color:var(--dim)}
  .t{font-size:15px;font-weight:600}
  .t a{color:var(--txt);text-decoration:none;border-bottom:1px dashed rgba(139,124,255,.5)}
  .t a:hover{color:var(--violet)}
  .meta{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .sum{color:#c3cbe0;font-size:13.5px;margin-top:7px}
  .why{color:var(--dim2);font-size:12px;margin-top:6px}
  .badge{padding:2px 8px;border-radius:7px;background:rgba(139,124,255,.14);color:#cfc9ff;font-size:11.5px}
  .badge.free{background:rgba(55,224,192,.14);color:#9ff0e0}
  .badge.off{background:rgba(255,190,85,.14);color:#ffd79a}
  .badge.official{background:rgba(55,224,192,.18);color:#9ff0e0;border:1px solid rgba(55,224,192,.32)}
  .badge.warn{background:rgba(255,255,255,.06);color:var(--dim2);border:1px dashed rgba(255,255,255,.18)}
  .origin{font-size:11.5px;color:var(--dim2);margin-left:8px}
  .src{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 16px;font-size:13.5px}
  .src + .src{border-top:1px solid var(--line)}
  .src .n{color:var(--txt)}
  .src .u{color:var(--dim2);font-size:12px}
  .num{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
  .empty{padding:34px;text-align:center;color:var(--dim2)}
  footer{margin-top:30px;color:var(--dim2);font-size:12px;text-align:center}
  code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;font-size:12px}
  @media (max-width:640px){.deal{grid-template-columns:44px 1fr}.kpi{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎯</div>
    <div>
      <h1>Deal-Hunter · 全网羊毛雷达</h1>
      <div class="sub" id="banner">载入中…</div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot" id="dot-feishu"></span>飞书推送 <b id="feishu">—</b></div>
    <div class="pill"><span class="dot" id="dot-run"></span>下一轮 <b id="next">—</b></div>
    <div class="pill"><span class="dot ok"></span>只读服务 · 仅本机/Tailscale</div>
  </header>

  <div class="grid stats">
    <div class="card"><div class="label">累计发现</div><div class="kpi" id="k-seen">0</div><div class="hint" id="k-seen-h">&nbsp;</div></div>
    <div class="card"><div class="label">已推送</div><div class="kpi" id="k-pushed">0</div><div class="hint">进入飞书消息的条数</div></div>
    <div class="card"><div class="label">待推送</div><div class="kpi" id="k-pending">0</div><div class="hint">静默期或失败会留在队列</div></div>
    <div class="card"><div class="label">信息源</div><div class="kpi" id="k-src">0<small>/ 0</small></div><div class="hint" id="k-src-h">启用 / 配置</div></div>
    <div class="card"><div class="label">最近一轮</div><div class="kpi" id="k-dur">—</div><div class="hint" id="k-dur-h">&nbsp;</div></div>
  </div>

  <div class="section">
    <h2>情报流</h2>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题 / 摘要 / 模型名…">
      <span class="chip" data-cat="" aria-pressed="true">全部</span>
      <span class="chip" data-cat="ai_free" aria-pressed="false">🤖 AI 免费</span>
      <span class="chip" data-cat="discount" aria-pressed="false">🏷️ 折扣</span>
      <span class="chip" data-cat="resource" aria-pressed="false">📦 资源</span>
      <span class="chip" data-cat="official" aria-pressed="false">✅ 已定位官方页</span>
      <span class="chip" data-cat="pushed" aria-pressed="false">📣 已推送</span>
      <div class="spacer"></div>
      <span class="num" id="count"></span>
    </div>
    <div class="card" id="deals" style="padding:0"><div class="empty">等待第一轮采集…</div></div>
  </div>

  <div class="section">
    <h2>信息源健康度</h2>
    <div class="card" id="sources" style="padding:0"><div class="empty">载入中…</div></div>
  </div>

  <footer>
    Deal-Hunter · Go 单二进制 · 零外部依赖 · 凭证只来自环境变量 ·
    OpenClaw 通过 <code>/api/v1/digest</code> 只读拉取
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = '';

function fmtDur(sec){
  if (!sec && sec !== 0) return '—';
  if (sec < 90) return Math.round(sec) + 's';
  if (sec < 5400) return Math.round(sec/60) + 'm';
  return (sec/3600).toFixed(1) + 'h';
}

async function j(path){
  const r = await fetch(path, {headers:{'Accept':'application/json'}});
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}

function scoreClass(n){ return n >= 78 ? 'hi' : n >= 58 ? 'mid' : 'low'; }

const KIND_LABEL = {official:'官方域名', search_verified:'厂商站内已校验', third_party:'第三方转述'};
const OFFICIAL_KINDS = new Set(['official', 'search_verified']);

function dealRow(d){
  const m = d.meta || {};
  const badges = [];
  if (d.is_free) badges.push('<span class="badge free">免费</span>');
  if (d.discount_pct) badges.push('<span class="badge off">' + d.discount_pct + '% off</span>');
  if (m.link_kind && KIND_LABEL[m.link_kind]) {
    const cls = m.link_kind === 'third_party' ? 'warn' : 'official';
    badges.push('<span class="badge ' + cls + '">' + KIND_LABEL[m.link_kind] + '</span>');
  }
  if (d.category) badges.push('<span class="badge">' + esc(d.category) + '</span>');
  (d.vendors || []).slice(0,2).forEach(v => badges.push('<span class="badge">' + esc(v) + '</span>'));
  // The verified vendor page leads; the post it came from stays one click away.
  const best = m.official_url || d.url || '';
  const link = /^https:\/\//.test(best)
    ? '<a href="' + esc(best) + '" target="_blank" rel="noopener noreferrer nofollow">' + esc(d.title) + '</a>'
    : esc(d.title);
  const origin = (m.original_url && m.original_url !== best && /^https:\/\//.test(m.original_url))
    ? '<a class="origin" href="' + esc(m.original_url) + '" target="_blank" rel="noopener noreferrer nofollow">原始出处</a>'
    : '';
  // The vendor's front door is a place to check, so it is offered next to an
  // unconfirmed link rather than replacing it.
  const site = (m.vendor_url && m.vendor_url !== best && m.vendor_url !== m.original_url && /^https:\/\//.test(m.vendor_url))
    ? '<a class="origin" href="' + esc(m.vendor_url) + '" target="_blank" rel="noopener noreferrer nofollow">厂商官网</a>'
    : '';
  const when = d.published_at ? new Date(d.published_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  const pushed = m.pushed === 'true' ? ' · 📣 已推送' : '';
  return '<div class="deal">' +
    '<div class="score ' + scoreClass(d.score) + '">' + d.score + '</div>' +
    '<div><div class="t">' + link + origin + site + '</div>' +
    '<div class="meta">' + badges.join('') + '<span>' + esc(d.source) + '</span>' +
    (when ? '<span>' + when + '</span>' : '') + '<span>' + esc((d.tags||[]).slice(0,3).map(t=>'#'+t).join(' ')) + pushed + '</span></div>' +
    (d.summary ? '<div class="sum">' + esc(d.summary.slice(0,240)) + '</div>' : '') +
    (d.score_why ? '<div class="why">评分：' + esc(d.score_why.slice(0,4).join('，')) + '</div>' : '') +
    '</div></div>';
}

async function loadDeals(){
  const q = $('q').value.trim();
  // 'official' and 'pushed' are meta-tags, not categories: filter client-side.
  let path;
  if (cat === 'pushed' || cat === 'official') path = '/api/v1/deals?limit=100&min=0';
  else path = '/api/v1/deals?limit=100&min=0' + (cat ? '&category=' + encodeURIComponent(cat) : '');
  if (q) path += '&q=' + encodeURIComponent(q);
  const data = await j(path);
  let deals = data.deals || [];
  if (cat === 'official') deals = deals.filter(d => OFFICIAL_KINDS.has((d.meta || {}).link_kind));
  else if (cat === 'pushed') deals = deals.filter(d => d.meta && d.meta.pushed === 'true');
  $('count').textContent = deals.length + ' 条';
  $('deals').innerHTML = deals.length
    ? deals.map(dealRow).join('')
    : '<div class="empty">暂无符合条件的记录</div>';
}

async function loadStatus(){
  const s = await j('/api/v1/status');
  $('banner').textContent = s.version + ' · 运行 ' + fmtDur(s.uptime_seconds) + ' · 轮询 ' + s.interval;
  const ok = !!s.feishu_ready;
  $('feishu').textContent = ok ? '就绪' : '未配置';
  $('dot-feishu').className = 'dot ' + (ok ? 'ok' : 'warn');
  const st = s.store || {};
  $('k-seen').textContent = st.deals_seen ?? 0;
  $('k-seen-h').textContent = '最近 ' + (st.newest ? new Date(st.newest).toLocaleString('zh-CN') : '—');
  $('k-pushed').textContent = st.pushed ?? 0;
  $('k-pending').textContent = st.pending_alerts ?? 0;
  const src = s.sources || {};
  $('k-src').innerHTML = (src.enabled ?? 0) + '<small>/ ' + (src.configured ?? 0) + '</small>';
  $('k-src-h').textContent = '告警阈值 ≥ ' + (s.filters ? s.filters.alert_min_score : '—');
  const lr = s.last_run;
  if (lr){
    const dur = (new Date(lr.finished_at) - new Date(lr.started_at)) / 1000;
    $('k-dur').innerHTML = fmtDur(dur) + '<small> 用时</small>';
    const off = (lr.verified_official ?? 0), third = (lr.third_party_links ?? 0);
    $('k-dur-h').textContent = '新增 ' + (lr.new_deals ?? 0) + ' · 推送 ' + (lr.pushed ?? 0) +
      (off + third > 0 ? ' · 官方 ' + off + '/' + (off + third) : '') +
      ' · 错误 ' + ((lr.errors||[]).length);
    const wait = (new Date(s.next_round_at) - Date.now()) / 1000;
    $('next').textContent = wait > 0 ? fmtDur(wait) : '即将';
    $('dot-run').className = 'dot ' + (wait > 0 ? 'ok' : 'warn');
  } else {
    $('k-dur').textContent = '—';
    $('k-dur-h').textContent = '尚未运行过';
  }
}

async function loadSources(){
  const data = await j('/api/v1/sources');
  const rows = (data.sources || []).map(s => {
    const last = s.last;
    let state = 'idle', cls = '';
    if (last){
      if (last.err) { state = '失败'; cls = 'bad'; }
      else { state = '正常'; cls = 'ok'; }
    }
    return '<div class="src"><div><div class="n">' +
      '<span class="dot ' + (cls || 'warn') + '"></span> ' + esc(s.name) +
      (s.official ? ' <span class="badge">官方源</span>' : '') +
      (s.enabled ? '' : ' <span class="badge off">已停用</span>') +
      '</div><div class="u">' + esc(s.kind) + ' · ' + esc(s.url) + '</div></div>' +
      '<div class="num">' + (last ? ('命中 ' + last.found + ' · 入库 ' + last.stored + ' · ' + last.ms + 'ms') : '—') + '</div>' +
      '<div class="num">' + esc(state) + (last && last.err ? ' ⚠' : '') + '</div></div>';
  });
  $('sources').innerHTML = rows.length ? rows.join('') : '<div class="empty">未配置信息源</div>';
}

async function refresh(){
  try {
    await Promise.all([loadStatus(), loadSources(), loadDeals()]);
  } catch (e) {
    $('banner').textContent = '读取状态失败：' + e.message;
  }
}

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');
  cat = c.dataset.cat;
  loadDeals().catch(() => {});
}));
let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => loadDeals().catch(()=>{}), 220); });

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
