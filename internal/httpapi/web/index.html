<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal-Hunter · 羊毛雷达</title>
<link rel="icon" href="/favicon.ico">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0a0d16; --panel:#111726; --panel2:#151d30; --line:#1f2941;
    --txt:#e8ecf6; --dim:#93a1bd; --dim2:#7d8bab;
    --aqua:#37e0c0; --violet:#8b7cff; --amber:#ffbe55; --rose:#ff6b81;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7); --r:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(139,124,255,.18), transparent 60%),
      radial-gradient(900px 500px at 88% 0%, rgba(55,224,192,.14), transparent 55%),
      var(--bg);
  }
  .wrap{max-width:1160px;margin:0 auto;padding:26px 22px 64px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .logo{
    width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;
    background:linear-gradient(140deg,var(--violet),var(--aqua));box-shadow:var(--shadow)
  }
  h1{font-size:20px;margin:0;letter-spacing:.3px;font-weight:650}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .status{display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--dim)
  }
  .pill b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
  .dot.ok{background:var(--aqua);box-shadow:0 0 0 4px rgba(55,224,192,.15)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(255,190,85,.15)}
  .dot.bad{background:var(--rose);box-shadow:0 0 0 4px rgba(255,107,129,.15)}
  .grid{display:grid;gap:12px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden
  }
  .stat{padding:14px 16px}
  .kpi{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.25}
  .kpi small{font-size:13px;color:var(--dim2);font-weight:400;margin-left:4px}
  .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);margin-bottom:5px}
  .hint{font-size:12px;color:var(--dim);margin-top:5px}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),#7ce8d3)}
  .bar.thin{height:5px;min-width:60px}
  .section{margin-top:24px}
  h2{
    font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);
    margin:0 0 10px;font-weight:650;display:flex;align-items:center;gap:10px
  }
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input[type=search]{
    background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:9px 13px;min-width:220px;font:inherit;font-size:13.5px;outline:none
  }
  input[type=search]:focus{border-color:var(--violet)}
  .chip{
    cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--dim);font:inherit;font-size:12.5px;
    user-select:none;transition:border-color .15s,background .15s,color .15s
  }
  .chip:hover{color:var(--txt)}
  .chip[aria-pressed=true]{border-color:var(--aqua);color:var(--txt);background:rgba(55,224,192,.1)}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:9px}

  /* One line per finding; the reasoning waits behind an explicit disclosure so
     the title link stays a link and the toggle stays a button. */
  .deal{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;gap:13px;
    align-items:start;padding:13px 16px}
  .deal + .deal{border-top:1px solid var(--line)}
  .score{
    height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;
    font-variant-numeric:tabular-nums;background:rgba(255,255,255,.04);border:1px solid var(--line)
  }
  .score.hi{color:#06121a;background:linear-gradient(150deg,var(--aqua),#7ce8d3);border-color:transparent}
  .score.mid{color:var(--aqua);border-color:rgba(55,224,192,.35)}
  .score.low{color:var(--dim)}
  .t{font-size:14.5px;font-weight:600;line-height:1.45}
  .t a{color:var(--txt);text-decoration:none;border-bottom:1px dashed rgba(139,124,255,.45)}
  .t a:hover{color:var(--violet);border-bottom-color:currentColor}
  .mark{margin-left:7px}
  .when{color:var(--dim2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
  .tog{
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer;margin-top:2px
  }
  .tog:hover{color:var(--txt);border-color:var(--violet)}
  .more{padding:12px 16px;text-align:center;border-top:1px solid var(--line)}
  .more .tog{padding:7px 16px;font-size:12.5px}
  .body{grid-column:1/-1;padding:2px 0 4px 59px;color:var(--dim);font-size:13px}
  .body[hidden]{display:none}
  .body p{margin:0 0 8px}
  .sum{color:#c3cbe0}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .badge{padding:2px 8px;border-radius:7px;background:rgba(139,124,255,.14);color:#cfc9ff;font-size:11.5px}
  .badge.free{background:rgba(55,224,192,.14);color:#9ff0e0}
  .badge.off{background:rgba(255,190,85,.14);color:#ffd79a}
  .badge.official{background:rgba(55,224,192,.18);color:#9ff0e0;border:1px solid rgba(55,224,192,.32)}
  .badge.warn{background:rgba(255,255,255,.06);color:var(--dim);border:1px dashed rgba(255,255,255,.18)}
  .why{color:var(--dim2);font-size:12px}
  .foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim2)}
  .foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  .foot a:hover{color:var(--aqua)}
  .src{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 16px;font-size:13.5px}
  .src + .src{border-top:1px solid var(--line)}
  .src .n{color:var(--txt)}
  .src .u{color:var(--dim2);font-size:12px;word-break:break-all}
  .run{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:14px;align-items:center;
    padding:11px 16px;font-size:12.5px}
  .run + .run{border-top:1px solid var(--line)}
  .run .n{color:var(--txt);font-weight:600}
  .run .tail{display:flex;align-items:center;gap:10px}
  .bad-text{color:var(--rose)}
  .num{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
  .empty{padding:30px;text-align:center;color:var(--dim2)}
  footer{margin-top:28px;color:var(--dim2);font-size:12px;text-align:center}
  code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;font-size:12px}
  @media (max-width:640px){
    .wrap{padding:16px 12px 44px}
    header{gap:10px;margin-bottom:14px}
    h1{font-size:17px}
    /* The build banner and per-card hints are desktop context; on a phone they
       push the actual deals off the screen. */
    .sub{display:none}
    .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .stat{padding:10px 11px}
    .stat .hint{display:none}
    .label{margin-bottom:2px}
    .kpi{font-size:19px}
    .section{margin-top:18px}
    .status{width:100%}
    .deal{grid-template-columns:38px minmax(0,1fr) auto;gap:5px 10px;padding:11px 12px}
    .when{grid-column:2;grid-row:2;padding-top:0}
    .tog{grid-column:3;grid-row:2;margin-top:0}
    .score{height:38px;font-size:15px}
    .body{padding:2px 0 4px 48px}
    .src,.run{grid-template-columns:1fr auto;gap:4px 10px}
    .run .tail{justify-content:flex-end}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎯</div>
    <div>
      <h1>Deal-Hunter · 全网羊毛雷达</h1>
      <div class="sub" id="banner">载入中…</div>
    </div>
    <div class="spacer"></div>
    <div class="status">
      <div class="pill"><span class="dot" id="dot-feishu"></span>飞书 <b id="feishu">—</b></div>
      <div class="pill"><span class="dot" id="dot-run"></span>下一轮 <b id="next">—</b></div>
      <div class="pill"><span class="dot ok" id="dot-sync"></span>最后同步 <b id="sync">—</b></div>
    </div>
  </header>

  <div class="grid stats">
    <div class="card stat"><div class="label">累计发现</div><div class="kpi" id="k-seen">0</div><div class="hint" id="k-seen-h">&nbsp;</div></div>
    <div class="card stat"><div class="label">已推送</div><div class="kpi" id="k-pushed">0</div><div class="hint">进入飞书消息的条数</div></div>
    <div class="card stat"><div class="label">待推送</div><div class="kpi" id="k-pending">0</div><div class="hint">静默期或失败会留在队列</div></div>
    <div class="card stat"><div class="label">信息源</div><div class="kpi" id="k-src">0<small>/ 0</small></div><div class="hint" id="k-src-h">启用 / 配置</div></div>
    <div class="card stat"><div class="label">最近一轮</div><div class="kpi" id="k-dur">—</div><div class="hint" id="k-dur-h">&nbsp;</div></div>
    <div class="card stat"><div class="label">链接成色</div><div class="kpi" id="k-off">—</div><div class="bar" style="margin-top:9px"><i id="k-off-bar" style="width:0%"></i></div><div class="hint" id="k-off-h">待推送条目的官方页定位率</div></div>
  </div>

  <div class="section">
    <h2>情报流</h2>
    <div class="toolbar" role="group" aria-label="情报筛选">
      <input type="search" id="q" placeholder="搜索标题 / 摘要 / 模型名…" aria-label="搜索情报">
      <button type="button" class="chip" data-cat="" aria-pressed="true">全部</button>
      <button type="button" class="chip" data-cat="ai_free" aria-pressed="false">🤖 AI 免费</button>
      <button type="button" class="chip" data-cat="discount" aria-pressed="false">🏷️ 折扣</button>
      <button type="button" class="chip" data-cat="resource" aria-pressed="false">📦 资源</button>
      <button type="button" class="chip" data-cat="official" aria-pressed="false">✅ 官方页已校验</button>
      <button type="button" class="chip" data-cat="pushed" aria-pressed="false">📣 已推送</button>
      <div class="spacer"></div>
      <span class="num" id="count"></span>
    </div>
    <div class="card" id="deals"><div class="empty">等待第一轮采集…</div></div>
  </div>

  <div class="section">
    <h2>采集记录</h2>
    <div class="card" id="runs"><div class="empty">载入中…</div></div>
  </div>

  <div class="section">
    <h2>信息源健康度</h2>
    <div class="card" id="sources"><div class="empty">载入中…</div></div>
  </div>

  <footer>
    Deal-Hunter · Go 单二进制 · 零外部依赖 · 凭证只来自环境变量 ·
    OpenClaw 通过 <code>/api/v1/digest</code> 只读拉取 · 点任意一行展开评分理由
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = '', shown = 24, all = [];
const opened = new Set();

const KIND_LABEL = {official:'厂商官方域名', search_verified:'官方页已校验', third_party:'第三方转述'};
const OFFICIAL_KINDS = new Set(['official', 'search_verified']);

function fmtDur(sec){
  if (!sec && sec !== 0) return '—';
  if (sec < 90) return Math.round(sec) + 's';
  if (sec < 5400) return Math.round(sec/60) + 'm';
  return (sec/3600).toFixed(1) + 'h';
}

// rel keeps a busy list scannable; the exact timestamp stays in the tooltip.
// A source that publishes no date falls back to when we found it.
function rel(iso){
  if (!iso) return '';
  const t = new Date(iso);
  if (isNaN(t) || t.getFullYear() < 2020) return '';
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 1) return '刚刚';
  if (mins < 60) return Math.round(mins) + ' 分钟前';
  if (mins < 1440) return Math.round(mins/60) + ' 小时前';
  return t.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
const stamp = (d) => { const r = rel(d.published_at); return r ? r : rel(d.discovered_at); };
const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : '—';
const isHTTPS = (u) => /^https:\/\//.test(u || '');
const scoreClass = (n) => n >= 78 ? 'hi' : n >= 58 ? 'mid' : 'low';

async function j(path){
  const r = await fetch(path, {headers:{'Accept':'application/json'}});
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}

function dealRow(d, i){
  const m = d.meta || {};
  // Open state is keyed by fingerprint, so re-rendering never collapses a row
  // the operator was already reading.
  const expanded = opened.has(d.fingerprint);
  // The verified vendor page leads; the post it came from stays one click away.
  const best = m.official_url || d.url || '';
  const kind = m.link_kind || '';
  const mark = OFFICIAL_KINDS.has(kind) ? '✅' : (kind === 'third_party' ? '⚠️' : '');
  const title = esc(d.title || '(无标题)');
  const head = isHTTPS(best)
    ? '<a href="' + esc(best) + '" target="_blank" rel="noopener noreferrer nofollow">' + title + '</a>'
    : title;

  const badges = [];
  if (d.is_free) badges.push('<span class="badge free">免费</span>');
  if (d.discount_pct) badges.push('<span class="badge off">' + d.discount_pct + '% off</span>');
  if (KIND_LABEL[kind]) badges.push('<span class="badge ' + (kind === 'third_party' ? 'warn' : 'official') + '">' + KIND_LABEL[kind] + '</span>');
  if (d.category) badges.push('<span class="badge">' + esc(d.category) + '</span>');
  (d.vendors || []).slice(0,3).forEach(v => badges.push('<span class="badge">' + esc(v) + '</span>'));
  (d.tags || []).slice(0,4).forEach(t => badges.push('<span class="badge">#' + esc(t) + '</span>'));

  // The entry page is a place to check, never proof that the offer is official.
  const links = [];
  if (m.original_url && m.original_url !== best && isHTTPS(m.original_url))
    links.push('<a href="' + esc(m.original_url) + '" target="_blank" rel="noopener noreferrer nofollow">原始出处</a>');
  if (m.vendor_url && m.vendor_url !== best && m.vendor_url !== m.original_url && isHTTPS(m.vendor_url))
    links.push('<a href="' + esc(m.vendor_url) + '" target="_blank" rel="noopener noreferrer nofollow">厂商官网入口</a>');

  const bodyId = 'body-' + (d.fingerprint || i);
  return '<div class="deal">' +
    '<span class="score ' + scoreClass(d.score) + '">' + d.score + '</span>' +
    '<span class="t">' + head + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</span>' +
    '<span class="when" title="' + esc(d.published_at || d.discovered_at || '') + '">' + stamp(d) + '</span>' +
    '<button type="button" class="tog" aria-controls="' + bodyId + '" aria-expanded="' + (expanded ? 'true' : 'false') + '">' +
      (expanded ? '收起' : '详情') + '</button>' +
    '<div class="body" id="' + bodyId + '"' + (expanded ? '' : ' hidden') + '>' +
      (d.summary ? '<p class="sum">' + esc(String(d.summary).slice(0,300)) + (String(d.summary).length > 300 ? ' …' : '') + '</p>' : '') +
      (badges.length ? '<div class="meta">' + badges.join('') + '</div>' : '') +
      (d.score_why && d.score_why.length ? '<p class="why">评分：' + esc(d.score_why.slice(0,6).join('，')) + '</p>' : '') +
      '<div class="foot"><span>来源 ' + esc(d.source) + '</span>' +
        (m.resolved_by ? '<span>定位 ' + esc(m.resolved_by) + '</span>' : '') +
        (m.pushed === 'true' ? '<span>📣 已推送</span>' : '') +
        (m.expires_at ? '<span>截止 ' + esc(String(m.expires_at).slice(0,10)) + '</span>' : '') +
        links.map(x => '<span>' + x + '</span>').join('') +
      '</div></div></div>';
}

async function loadDeals(){
  const q = $('q').value.trim();
  // 'official' and 'pushed' are meta tags, not categories: filter client-side.
  let path = '/api/v1/deals?limit=100&min=0';
  if (cat && cat !== 'pushed' && cat !== 'official') path += '&category=' + encodeURIComponent(cat);
  if (q) path += '&q=' + encodeURIComponent(q);
  let deals = (await j(path)).deals || [];
  if (cat === 'official') deals = deals.filter(d => OFFICIAL_KINDS.has((d.meta||{}).link_kind));
  else if (cat === 'pushed') deals = deals.filter(d => (d.meta||{}).pushed === 'true');
  all = deals;
  $('count').textContent = deals.length + ' 条';
  paintDeals();
}

// A 60-item list is a wall; render a screenful and let the operator ask for more.
function paintDeals(){
  if (!all.length){
    $('deals').innerHTML = '<div class="empty">暂无符合条件的记录</div>';
    return;
  }
  const page = all.slice(0, shown);
  $('deals').innerHTML = page.map((d, i) => dealRow(d, i)).join('') +
    (all.length > page.length
      ? '<div class="more"><button type="button" class="tog" id="more">显示更多 · 还有 ' + (all.length - page.length) + ' 条</button></div>'
      : '');
}

// A run row is where a missing alert usually explains itself.
function runRow(r){
  const off = r.verified_official || 0, total = off + (r.third_party_links || 0);
  const pct = total ? Math.round(off * 100 / total) : 0;
  const errs = r.errors || [];
  const dur = (new Date(r.finished_at) - new Date(r.started_at)) / 1000;
  return '<div class="run"><div><span class="n">' + hhmm(r.finished_at) + '</span> · ' + esc(r.trigger || '—') + '</div>' +
    '<div class="num">新增 ' + (r.new_deals || 0) + ' · 推送 ' + (r.pushed || 0) +
      (r.held_quiet ? ' · 静默 ' + r.held_quiet : '') +
      (total ? ' · 官方 ' + off + '/' + total : '') +
      (errs.length ? ' · <span class="bad-text">错误 ' + errs.length + '</span>' : '') + '</div>' +
    '<div class="tail">' +
      (total ? '<span class="bar thin" title="官方页定位率 ' + pct + '%"><i style="width:' + pct + '%"></i></span>' : '') +
      '<span class="num">' + fmtDur(dur) + '</span></div></div>';
}

// Link quality is a property of the recent rounds, not of whichever round
// happened to finish last: a quiet round must not blank the card out.
function paintQuality(runs){
  let off = 0, total = 0, rounds = 0;
  for (const r of runs){
    const v = r.verified_official || 0, t = v + (r.third_party_links || 0);
    if (t){ off += v; total += t; rounds++; }
  }
  const pct = total ? Math.round(off * 100 / total) : 0;
  $('k-off').textContent = total ? pct + '%' : '—';
  $('k-off-bar').style.width = pct + '%';
  $('k-off-h').textContent = total
    ? '近 ' + rounds + ' 轮共 ' + off + '/' + total + ' 定位到厂商官方页'
    : '最近的采集轮里没有待推送的新条目';
}

async function loadRuns(){
  const runs = ((await j('/api/v1/runs?limit=8')).runs || []).slice().reverse();
  $('runs').innerHTML = runs.length
    ? runs.map(runRow).join('')
    : '<div class="empty">还没有采集记录</div>';
  paintQuality(runs);
}

async function loadStatus(){
  const s = await j('/api/v1/status');
  $('banner').textContent = s.version + ' · 已运行 ' + fmtDur(s.uptime_seconds) + ' · 轮询 ' + s.interval;
  const ok = !!s.feishu_ready;
  $('feishu').textContent = ok ? (s.feishu_mode || '就绪') : '未配置';
  $('dot-feishu').className = 'dot ' + (ok ? 'ok' : 'warn');
  const st = s.store || {};
  $('k-seen').textContent = st.deals_seen ?? 0;
  $('k-seen-h').textContent = '最近 ' + (st.newest ? new Date(st.newest).toLocaleString('zh-CN') : '—');
  $('k-pushed').textContent = st.pushed ?? 0;
  $('k-pending').textContent = st.pending_alerts ?? 0;
  const src = s.sources || {};
  $('k-src').innerHTML = (src.enabled ?? 0) + '<small>/ ' + (src.configured ?? 0) + '</small>';
  $('k-src-h').textContent = '告警阈值 ≥ ' + (s.filters ? s.filters.alert_min_score : '—');
  const lr = s.last_run;
  if (!lr){
    $('k-dur').textContent = '—';
    $('k-dur-h').textContent = '尚未运行过';
    return; // loadRuns owns the quality card, so it stays consistent.
  }
  const dur = (new Date(lr.finished_at) - new Date(lr.started_at)) / 1000;
  $('k-dur').innerHTML = fmtDur(dur) + '<small> 用时</small>';
  $('k-dur-h').textContent = '新增 ' + (lr.new_deals ?? 0) + ' · 推送 ' + (lr.pushed ?? 0) +
    ' · 错误 ' + ((lr.errors||[]).length);
  const wait = (new Date(s.next_round_at) - Date.now()) / 1000;
  $('next').textContent = wait > 0 ? fmtDur(wait) : '即将';
  $('dot-run').className = 'dot ' + (wait > 0 ? 'ok' : 'warn');
}

async function loadSources(){
  const data = await j('/api/v1/sources');
  const rows = (data.sources || []).map(s => {
    const last = s.last;
    let state = '未运行', cls = 'warn';
    if (last){ cls = last.err ? 'bad' : 'ok'; state = last.err ? '失败' : '正常'; }
    return '<div class="src"><div><div class="n">' +
      '<span class="dot ' + cls + '"></span> ' + esc(s.name) +
      (s.official ? ' <span class="badge official">官方源</span>' : '') +
      (s.enabled ? '' : ' <span class="badge off">已停用</span>') +
      '</div><div class="u">' + esc(s.kind) + ' · ' + esc(s.url) + '</div></div>' +
      '<div class="num">' + (last ? ('命中 ' + last.found + ' · 入库 ' + last.stored + ' · ' + last.ms + 'ms') : '—') + '</div>' +
      '<div class="num">' + esc(state) + '</div></div>';
  });
  $('sources').innerHTML = rows.length ? rows.join('') : '<div class="empty">未配置信息源</div>';
}

async function refresh(){
  try {
    await Promise.all([loadStatus(), loadSources(), loadDeals(), loadRuns()]);
    $('sync').textContent = new Date().toLocaleTimeString('zh-CN');
    $('dot-sync').className = 'dot ok';
  } catch (e) {
    // Keep the last good data on screen, but stop pretending it is fresh.
    $('dot-sync').className = 'dot bad';
    $('banner').textContent = '读取状态失败：' + e.message;
  }
}

// One delegated handler: rows are re-rendered on every refresh.
$('deals').addEventListener('click', (e) => {
  if (e.target.id === 'more'){
    shown += 24;
    paintDeals();
    return;
  }
  const b = e.target.closest('.tog');
  if (!b) return;
  const body = document.getElementById(b.getAttribute('aria-controls'));
  const wasOpen = b.getAttribute('aria-expanded') === 'true';
  b.setAttribute('aria-expanded', String(!wasOpen));
  b.textContent = wasOpen ? '详情' : '收起';
  if (body) body.hidden = wasOpen;
  const fp = (body && body.id.replace('body-', '')) || '';
  if (fp) { wasOpen ? opened.delete(fp) : opened.add(fp); }
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');
  cat = c.dataset.cat;
  shown = 24;
  loadDeals().catch(() => {});
}));
let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  shown = 24;
  timer = setTimeout(() => loadDeals().catch(() => {}), 220);
});

refresh();
// A background tab has no reason to keep polling.
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
</script>
</body>
</html>
