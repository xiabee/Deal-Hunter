<!doctype html>
<html>
<head><title>DuckDuckGo</title></head>
<body>
<!-- Trimmed from a real lite.duckduckgo.com response captured 2026-09-21, with the
     per-request signature tokens removed. This is what the engine answers when it
     decides the egress IP looks automated: HTTP 200, no results, no error. -->
<div class="anomaly-modal__mask"></div>
<div class="anomaly-modal__modal" data-testid="anomaly-modal">
  <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
  <div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
  <form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=lite&amp;cc=botnet" method="POST"></form>
  <form id="img-form" action="//duckduckgo.com/anomaly.js?sv=lite&amp;cc=botnet" target="ifr" method="POST"></form>
</div>
</body>
</html>
